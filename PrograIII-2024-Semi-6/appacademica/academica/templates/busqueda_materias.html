<form id="frmBusquedaMateria">
    <div class="card text-bg-dark mb-3">
        <div class="card-header">
            <div class="d-flex">
                Consulta de Materias
                <div class="ms-auto">
                    <input type="text" id="buscadorMateria" placeholder="Buscar materias..." oninput="buscarMaterias()">
                    <button type="button" data-form="busqueda_materias" class="btn-close btn-close-white" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <table class="table table-hover" id="tblMaterias">
                <thead>
                    <tr>
                        <th>CODIGO</th>
                        <th>NOMBRE</th>
                        <th>UV</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</form>
<script>
    function eliminarMateria(idMateria) {
    alertify.confirm(
        'Confirmar Eliminación',
        '¿Desea eliminar este registro?',
        function() {
            let datos = {
                accion: "eliminar",
                idMateria: idMateria,
            };
            enviarDatosMateria(datos);
            
        },
        function() {
            alertify.error('Eliminación cancelada');
        }
    );
}

    
    function consultarMaterias(){
        fetch('consultar_materias/')
        .then(res => res.json())
        .then(data => {
            mostrarFilasMaterias(data);
        })
        .catch(err => console.log(err));
    }

    function buscarMaterias(){
        const filtro = document.getElementById('buscadorMateria').value.toLowerCase();
        fetch(`consultar_materias/?q=${filtro}`)
        .then(res => res.json())
        .then(data => {
            mostrarFilasMaterias(data);
        })
        .catch(err => console.log(err));
    }

    function mostrarFilasMaterias(data = []){
        let filas = '';
        data.forEach(materia => {
            filas += `
                <tr onClick='modificarMateria(${JSON.stringify(materia)})'>
                    <td>${materia.codigo}</td>
                    <td>${materia.nombre}</td>
                    <td>${materia.uv}</td>
                    <td>
                        <button type="button" class="btn btn-outline-danger" onClick='eliminarMateria(${materia.id})'>DEL</button>
                    </td>
                </tr>
            `;
        });
        document.querySelector('#tblMaterias > tbody').innerHTML = filas;
    }

    consultarMaterias();
</script>
